# Generated by the claudeconf skill — FULLY managed; rewritten WHOLESALE on re-run
# (constitution §4.4). There are no sentinels here because the whole file is the managed
# region. Project-owned jobs belong in the root lefthook.yml (which extends this file) and
# must be declared in `.claudeconf/manifest.json` projectChecks[], so a regeneration that
# drops one FAILS instead of passing silently. Edit tools/versions via the manifest.
#
# Node tools are invoked by their PINNED project-local path (`node_modules/.bin/<tool>`),
# never through an on-demand package runner: `npx` in any form resolves whatever is cached
# under that bin name, including a foreign package (contract §3.3). trufflehog and semgrep
# are pinned globals invoked by name; `.claudeconf/bin/assert-tool-versions.mjs` asserts them.
#
# Install hooks: `node_modules/.bin/lefthook install` — the three runner-pinning settings
# below are baked into `.git/hooks/*` at install time, so ANY change to them REQUIRES a
# reinstall or the shims keep resolving the old runner.
#
# Tier ladder (constitution §1):
#   pre-commit → lint, typecheck, unit(changed), secret-scan      [blocking, changed]
#   pre-push   → typecheck, unit(full), sast, dep-audit, build    [blocking, all]
#   gate       → the FULL battery (Gate ≡ CI): format-check(advisory), lint,
#                typecheck, unit+coverage, sast, secret-scan(whole tree),
#                dep-audit(advisory), build, e2e, plus the harness-infrastructure
#                jobs tool-versions, workflow-audit, suppressions, project-checks
# `format` autofix runs at the edit tier (.claude/settings.json); in `gate` it is a
# non-blocking check (`|| true`) — it never sits in a blocking group (contract §3.3).
#
# All tool versions are pinned via package.json / the lock file and the pinned configs
# under .claudeconf/. Hooks never fetch tools at runtime (constitution §4.2).

# Runner pinning (contract §1/§3.2). `lefthook:` is ALSO written in the root file's managed
# block: lefthook does NOT merge that one setting across `extends` (verified against 2.1.9 —
# it is absent from `lefthook dump` and the shim keeps resolving a global runner), while
# `assert_lefthook_installed` and `min_version` DO merge. The copy here keeps the value under
# managed ownership; the installed shim is the arbiter (checker D6), not either file.
lefthook: node_modules/.bin/lefthook
assert_lefthook_installed: true
min_version: "2.1.10"

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: node_modules/.bin/biome lint --no-errors-on-unmatched {staged_files}

    - name: typecheck
      glob: "*.{ts,tsx}"
      run: node_modules/.bin/tsc --noEmit

    - name: unit-changed
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: node_modules/.bin/vitest related --run {staged_files}

    - name: secret-scan
      glob: "*"
      run: trufflehog filesystem {staged_files} --no-update --no-verification --fail

commit-msg:
  jobs:
    - name: commitlint
      # Conventional Commits enforced at the commit-msg hook (patterns/node.md); the
      # ruleset lives in commitlint.config.js and is pinned via the two @commitlint/*
      # devDependencies.
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: node_modules/.bin/tsc --noEmit

    - name: unit-full
      run: node_modules/.bin/vitest run

    - name: sast
      run: semgrep scan --error --quiet --config .claudeconf/rules/

    - name: dependency-audit
      # Advisory (constitution §2): audit results vary with registry state, so a
      # finding must not block the push. Surfaced, never fatal.
      run: npm audit --audit-level=high || true

    - name: build
      run: npm run build

# `gate` is a named group run on demand (`node_modules/.bin/lefthook run gate`) and mirrored
# by CI. Gate ≡ CI (constitution §1): the full battery at full scope.
# Project-owned gate jobs live in the root lefthook.yml, BELOW its managed block.
gate:
  parallel: false
  jobs:
    - name: tool-versions
      # Version enforcement for bare-name global tools AND for the hook runner itself,
      # resolved the way the installed shim resolves it (contract §3.4).
      run: node .claudeconf/bin/assert-tool-versions.mjs

    - name: workflow-audit
      # The CI workflow is itself a supply-chain artifact (manifest ci.auditors).
      # zizmor is a preinstalled pinned global (`uv tool install zizmor==1.29.0`)
      # — hooks never fetch tooling at runtime (constitution §4.2); the
      # tool-versions job asserts it.
      run: actionlint -color && zizmor --min-severity medium .github/workflows/

    - name: suppressions
      # Unapproved suppressions/exclusion-widenings fail (constitution §4.7.2).
      run: node .claudeconf/bin/check-suppressions.mjs

    - name: project-checks
      # Every project-owned check the manifest DECLARES must still resolve at every tier
      # it claims (contract §1 "Project-check assertion"). Wired even though this project
      # declares none, so declaring one later needs no rewiring.
      run: node .claudeconf/bin/check-project-checks.mjs

    - name: format-check
      # Advisory (constitution §2): surfaced, never blocks.
      run: node_modules/.bin/biome format . || true

    - name: lint
      run: node_modules/.bin/biome lint .

    - name: typecheck
      run: node_modules/.bin/tsc --noEmit

    - name: unit-coverage
      run: node_modules/.bin/vitest run --coverage

    - name: sast
      run: semgrep scan --error --quiet --config .claudeconf/rules/

    - name: secret-scan
      # The CANDIDATE tree (the index) — what CI's checkout scans; never ignored/untracked files.
      run: node .claudeconf/bin/scan-tree.mjs -- trufflehog filesystem {tree} --no-update --no-verification --fail --exclude-paths .claudeconf/trufflehog-exclude.txt

    - name: dependency-audit
      run: npm audit --audit-level=high || true

    - name: build
      run: npm run build

    - name: e2e
      run: npm run test:e2e

# CI workflow. The HEADER below (`name`, `on`, `permissions`, `concurrency`, `jobs:`) is
# PROJECT-OWNED and sits OUTSIDE the managed block: a regeneration preserves it, and it is
# constrained to exactly that allowlist — no workflow-level `env` or `defaults` (they would
# alter managed jobs from outside) and no duplicate job ids (they would shadow a managed
# definition). Contract §1/§3.3.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege by default (constitution §4.1 / patterns/ci-github-actions.md).
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Add PROJECT-OWNED jobs BELOW the managed block and declare each one in
# `.claudeconf/manifest.json` projectChecks[]. Anything INSIDE the block is rewritten
# wholesale on the next regeneration.
jobs:
# >>> claudeconf managed >>>
# Generated by the claudeconf skill — mirrors the local `gate` tier (Gate ≡ CI,
# constitution §1) and is the authoritative pass/fail signal for pull requests
# (constitution §3). Every `uses:` is pinned to a full commit SHA (§4.1) and every docker
# image to an immutable `@sha256:` digest — the trailing comment records the human-readable
# version Dependabot bumps. Node tools are invoked by their pinned project-local path, never
# through an on-demand package runner (contract §3.3).
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0  # check-suppressions needs the merge base

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # The runtime is pinned in a file the project and CI both read, so a developer's
          # shell and this workflow cannot disagree. Node 24 is the Active LTS line on the
          # generation date; 20 went end-of-life 2026-04-30 and must not be emitted.
          node-version-file: .nvmrc
          cache: "npm"
      - name: pin npm (release-age floor needs npm >= 11.10)
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        # FROZEN install against the committed package-lock.json (generated with
        # npm 11.17.0) — no fresh-resolution fallback (wiring-principles §8).
        run: npm ci

      # -- format (check mode; advisory at every tier, constitution §2) --
      # §2.4: the step name LEADS with a name from the milestone's row, so the step is
      # located by token and never by prose.
      - name: format-check
        run: node_modules/.bin/biome format .
        continue-on-error: true

      # -- lint --
      - name: lint
        run: node_modules/.bin/biome lint .

      # -- typecheck --
      - name: typecheck
        run: node_modules/.bin/tsc --noEmit

      # -- unit tests + coverage (gate tier) --
      - name: unit-coverage
        run: node_modules/.bin/vitest run --coverage

      # -- build --
      - name: build
        run: npm run build

      # -- dependency audit (advisory -- surfaced, never blocks) --
      - name: dependency-audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # -- secret scan (pinned, offline, deterministic; whole tree with excludes --
      # the exclude file is REGEXES and must cover .git/, see security.md) --
      - name: secret-scan
        uses: docker://trufflesecurity/trufflehog@sha256:96f8429082cb2d4ae73b1096dcdb2f5aa139881d97042b0c5e5fa226a392e056  # 3.95.6
        with:
          args: filesystem . --no-update --no-verification --fail --exclude-paths .claudeconf/trufflehog-exclude.txt

      # -- SAST (semgrep, pinned offline ruleset -- never --config auto) --
      - name: sast (semgrep)
        uses: docker://semgrep/semgrep@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e # 1.168.0
        with:
          args: semgrep scan --error --quiet --config .claudeconf/rules/


      # -- suppression approval ledger (constitution §4.7.2) --
      - name: suppressions
        run: node .claudeconf/bin/check-suppressions.mjs

      # -- project-owned checks the manifest DECLARES still resolve at every tier they
      # claim (contract §1). Wired even when none are declared, so declaring one later
      # needs no rewiring. --
      - name: project-checks
        run: node .claudeconf/bin/check-project-checks.mjs

      # -- e2e (gate + CI) -- library-consumer mode via the project's own runner --
      - name: e2e
        run: npm run test:e2e
  # The workflow file is itself a supply-chain artifact (contract §1): a pinned
  # syntax auditor + security auditor check it here AND in the local gate
  # (recorded in manifest ci.auditors).
  workflow-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: actionlint (workflow syntax + shellcheck)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
      - name: zizmor (workflow security audit)
        uses: docker://ghcr.io/zizmorcore/zizmor@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284  # 1.29.0
        with:
          args: --min-severity medium .github/workflows/
# <<< claudeconf managed <<<
  # ---- project-owned jobs (added on first generation, owned by the project after) --------
  # A regeneration rewrites the block ABOVE, never what follows it. Declare each job you add
  # here in `.claudeconf/manifest.json` projectChecks[] (name + tiers + a `run` substring) so
  # a regeneration that loses one FAILS instead of passing quietly.
  #
  # `dependency-review` blocks newly-introduced vulnerable dependencies and disallowed
  # licences on pull requests — the gate-tier "license/dependency review". It is deliberately
  # NOT declared in projectChecks: a declaration demands reachability for the authoritative PR
  # event, and this job's condition cannot demonstrate that. The action needs a public repo or
  # GitHub Advanced Security, so on a private repo without GHAS it is SKIPPED rather than
  # broken. Held to the managed supply-chain bar anyway (SHA pin, least privilege).
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # deny-licenses: GPL-3.0, AGPL-3.0   # set a licence policy for the project
